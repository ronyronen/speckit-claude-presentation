<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 10; }
    .box-ai { fill: #fef3c7; stroke: #d97706; }
    .box-spec { fill: #dbeafe; stroke: #2563eb; }
    .box-fix { fill: #fee2e2; stroke: #dc2626; }
    .lbl { font-size: 16px; fill: #1e293b; text-anchor: middle; }
    .lbl-en { font-size: 11px; fill: #475569; text-anchor: middle; }
    .title { font-size: 20px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    .arrow { stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="500" y="30" class="title">פיתוח ישיר מול פיתוח מונחה-מפרט</text>

  <!-- Row 1: Direct prompting loop -->
  <text x="60" y="80" class="lbl" text-anchor="start" font-weight="bold">פרומפט ישיר:</text>
  <g>
    <rect x="40" y="95" width="120" height="55" class="box"/>
    <text x="100" y="118" class="lbl">פרומפט</text>
    <text x="100" y="136" class="lbl-en">Prompt</text>
  </g>
  <path d="M160,122 H210" class="arrow"/>
  <g>
    <rect x="210" y="95" width="120" height="55" class="box box-ai"/>
    <text x="270" y="118" class="lbl">סוכן AI</text>
    <text x="270" y="136" class="lbl-en">Claude / Codex</text>
  </g>
  <path d="M330,122 H380" class="arrow"/>
  <g>
    <rect x="380" y="95" width="120" height="55" class="box"/>
    <text x="440" y="118" class="lbl">קוד</text>
    <text x="440" y="136" class="lbl-en">Code</text>
  </g>
  <path d="M500,122 H550" class="arrow"/>
  <g>
    <rect x="550" y="95" width="120" height="55" class="box box-fix"/>
    <text x="610" y="118" class="lbl">תיקון</text>
    <text x="610" y="136" class="lbl-en">Fix</text>
  </g>
  <path d="M670,122 H720" class="arrow"/>
  <g>
    <rect x="720" y="95" width="120" height="55" class="box"/>
    <text x="780" y="118" class="lbl">פרומפט</text>
    <text x="780" y="136" class="lbl-en">Prompt</text>
  </g>
  <path d="M840,122 H880" class="arrow"/>
  <path d="M880,122 C 920,122 920,180 780,180 L 500,180" class="arrow"/>
  <text x="700" y="200" class="lbl-en" font-style="italic">חוזר חלילה, ללא זיכרון קבוע של ההחלטות</text>

  <!-- Row 2: Spec-driven pipeline -->
  <text x="60" y="270" class="lbl" text-anchor="start" font-weight="bold">מונחה-מפרט:</text>
  <g>
    <rect x="30" y="285" width="90" height="55" class="box"/>
    <text x="75" y="308" class="lbl">רעיון</text>
    <text x="75" y="326" class="lbl-en">Idea</text>
  </g>
  <path d="M120,312 H160" class="arrow"/>
  <g>
    <rect x="160" y="285" width="100" height="55" class="box box-spec"/>
    <text x="210" y="308" class="lbl">מפרט</text>
    <text x="210" y="326" class="lbl-en">Spec</text>
  </g>
  <path d="M260,312 H300" class="arrow"/>
  <g>
    <rect x="300" y="285" width="100" height="55" class="box box-spec"/>
    <text x="350" y="308" class="lbl">הבהרה</text>
    <text x="350" y="326" class="lbl-en">Clarify</text>
  </g>
  <path d="M400,312 H440" class="arrow"/>
  <g>
    <rect x="440" y="285" width="100" height="55" class="box box-spec"/>
    <text x="490" y="308" class="lbl">תכנון</text>
    <text x="490" y="326" class="lbl-en">Plan</text>
  </g>
  <path d="M540,312 H580" class="arrow"/>
  <g>
    <rect x="580" y="285" width="100" height="55" class="box box-spec"/>
    <text x="630" y="308" class="lbl">משימות</text>
    <text x="630" y="326" class="lbl-en">Tasks</text>
  </g>
  <path d="M680,312 H720" class="arrow"/>
  <g>
    <rect x="720" y="285" width="120" height="55" class="box box-ai"/>
    <text x="780" y="308" class="lbl">סוכן AI</text>
    <text x="780" y="326" class="lbl-en">Claude / Codex</text>
  </g>
  <path d="M840,312 H880" class="arrow"/>
  <g>
    <rect x="880" y="285" width="90" height="55" class="box"/>
    <text x="925" y="308" class="lbl">קוד</text>
    <text x="925" y="326" class="lbl-en">Code</text>
  </g>

  <text x="500" y="390" class="lbl" font-style="italic">ההחלטות החשובות נקבעות לפני הקוד, ונשמרות ברפוזיטורי</text>
</svg>
