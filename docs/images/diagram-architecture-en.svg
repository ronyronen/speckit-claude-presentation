<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 10; }
    .box-hw { fill: #fee2e2; stroke: #dc2626; }
    .box-logic { fill: #dbeafe; stroke: #2563eb; }
    .box-out { fill: #dcfce7; stroke: #16a34a; }
    .lbl { font-size: 15px; fill: #1e293b; text-anchor: middle; font-weight: bold; }
    .lbl-en { font-size: 11px; fill: #475569; text-anchor: middle; font-family: monospace; }
    .arrow { stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow4); fill: none; }
    .title { font-size: 20px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="450" y="28" class="title">Heltec Monitor Architecture</text>

  <g>
    <rect x="20" y="110" width="140" height="60" class="box box-hw"/>
    <text x="90" y="136" class="lbl">Sensor</text>
    <text x="90" y="154" class="lbl-en">BME280 (I2C)</text>
  </g>
  <path d="M160,140 H210" class="arrow"/>

  <g>
    <rect x="210" y="110" width="150" height="60" class="box"/>
    <text x="285" y="136" class="lbl">Sensor Adapter</text>
    <text x="285" y="154" class="lbl-en">sensor_adapter</text>
  </g>
  <path d="M360,140 H410" class="arrow"/>

  <g>
    <rect x="410" y="80" width="180" height="120" class="box box-logic"/>
    <text x="500" y="115" class="lbl">Decision Logic</text>
    <text x="500" y="135" class="lbl-en">monitor_logic</text>
    <text x="500" y="155" class="lbl-en">OK / WARNING /</text>
    <text x="500" y="170" class="lbl-en">SENSOR_ERROR</text>
    <text x="500" y="188" class="lbl-en" font-style="italic">no hardware deps</text>
  </g>

  <path d="M590,110 C 650,60 700,60 720,80" class="arrow"/>
  <path d="M590,140 H700" class="arrow"/>
  <path d="M590,170 C 650,220 700,220 720,205" class="arrow"/>

  <g>
    <rect x="720" y="50" width="150" height="55" class="box box-out"/>
    <text x="795" y="74" class="lbl">OLED Display</text>
    <text x="795" y="92" class="lbl-en">display_adapter</text>
  </g>
  <g>
    <rect x="700" y="115" width="150" height="55" class="box box-out"/>
    <text x="775" y="139" class="lbl">Serial</text>
    <text x="775" y="157" class="lbl-en">serial_reporter</text>
  </g>
  <g>
    <rect x="720" y="180" width="150" height="55" class="box box-out"/>
    <text x="795" y="204" class="lbl">Tests</text>
    <text x="795" y="222" class="lbl-en">test_monitor_logic</text>
  </g>

  <text x="450" y="260" class="lbl" font-weight="normal" font-style="italic" font-size="14">Only monitor_logic is tested with zero hardware (pio test -e native)</text>
</svg>
