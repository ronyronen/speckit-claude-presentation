; PlatformIO project for the Heltec WiFi Kit V3 environmental monitor.
; See specs/001-heltec-monitor/ for the spec/plan/tasks that produced this.

; Two interchangeable temperature sensors are supported, selected at
; build time (specs/001-heltec-monitor, GitHub issue #2): DHT22 (default,
; the sensor on hand for this workshop run) and BME280 (explicit env).
; `native` is a host-only test environment (see below) with no main() of
; its own -- running it as a normal build/upload target fails to link.
; Use `pio test -e native` for it.
[platformio]
default_envs = heltec_wifi_kit_32_V3_dht22

; DHT22 (AM2302): 3-pin module (GND/VCC/DATA), on-board pull-up, DATA on
; GPIO4 (verified against the installed framework-arduinoespressif32
; variant's pins_arduino.h for this board -- see research.md), powered
; via Vext. Temperature only (humidity is a suggested student extension).
[env:heltec_wifi_kit_32_V3_dht22]
platform = espressif32
board = heltec_wifi_kit_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.0.0
build_src_filter =
    +<*>
    -<sensor_adapter_bme280.cpp>

; BME280: I2C, same bus as the OLED, powered via Vext.
[env:heltec_wifi_kit_32_V3]
platform = espressif32
board = heltec_wifi_kit_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.0.0
build_src_filter =
    +<*>
    -<sensor_adapter_dht22.cpp>

; Host-only environment: compiles and runs firmware/test/ on this machine,
; no Heltec board required. Only monitor_logic (Constitution Principle I)
; is compiled here -- it has zero Arduino/hardware dependencies.
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<monitor_logic.cpp>
test_filter = test_monitor_logic
