; PlatformIO project for the Heltec WiFi Kit V3 environmental monitor.
; See specs/001-heltec-monitor/ for the spec/plan/tasks that produced this.

; Only build/upload the board by default. `native` is a host-only test
; environment (see below) with no main() of its own -- running it as a
; normal build/upload target fails to link. Use `pio test -e native` for it.
[platformio]
default_envs = heltec_wifi_kit_32_V3

[env:heltec_wifi_kit_32_V3]
platform = espressif32
board = heltec_wifi_kit_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.0.0

; Host-only environment: compiles and runs firmware/test/ on this machine,
; no Heltec board required. Only monitor_logic (Constitution Principle I)
; is compiled here -- it has zero Arduino/hardware dependencies.
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<monitor_logic.cpp>
test_filter = test_monitor_logic
