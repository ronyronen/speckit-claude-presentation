  - id: shared-constitution
    part: VI
    budget: "1:00"
    layout: bullets
    title: { en: "One constitution for many projects", he: "constitution אחת לכמה פרויקטים" }
    bullets:
      - { key: rules, en: "House rules on the fridge: testing, naming, security, review", he: "חוקי הבית על המקרר: בדיקות, שמות, אבטחה, review" }
      - { key: reuse, en: "Start each new project from one shared template", he: "כל פרויקט חדש מתחיל מתבנית משותפת אחת" }
    tip: { key: short-constitution, en: "Keep the constitution short; rules nobody reads are rules nobody follows.", he: "שמרו על constitution קצרה; כללים שאף אחד לא קורא, אף אחד לא מקיים." }
    notes:
      en: |
        Analogy: the house rules on the fridge. Every flatmate follows the same rules, and a new flatmate reads them on day one.
        A constitution is a project's house rules. Our Heltec project has five principles, such as "decision logic is hardware-independent" and "every threshold decision is explicit".
        The next step is one constitution shared across projects and teams: testing rules, naming, security, review. In Spec Kit each project keeps its own constitution file, so sharing is a team practice rather than a built-in feature: keep a template, copy it into every new project as the starting point, then add the project's own rules.
        Tip: keep the constitution short; rules nobody reads are rules nobody follows.
      he: |
        Analogy: חוקי הבית על המקרר. כל השותפים בדירה מקיימים את אותם כללים, ושותף חדש קורא אותם ביום הראשון.
        constitution היא חוקי הבית של פרויקט. לפרויקט ה-Heltec שלנו יש חמישה עקרונות, כמו “לוגיקת ההחלטות לא תלויה בחומרה” ו“כל החלטה על סף היא מפורשת”.
        הצעד הבא הוא constitution אחת, משותפת לכמה פרויקטים וצוותים: כללי בדיקות, שמות, אבטחה, review. ב-Spec Kit לכל פרויקט יש קובץ constitution משלו, אז השיתוף הוא נוהל צוותי ולא פיצ'ר מובנה: מחזיקים תבנית, מעתיקים אותה לכל פרויקט חדש כנקודת התחלה, ומוסיפים את הכללים של הפרויקט עצמו.
        TIP: שמרו על constitution קצרה; כללים שאף אחד לא קורא, אף אחד לא מקיים.

