    notes:
      en: |
        Welcome. AI means artificial intelligence, and today is about one idea: when you build software with an AI coding assistant like Claude Code or Codex, write down what you want before it writes the code. That is Spec-Driven Development, or SDD. A spec is simply a written description of what the software should do.
        The theory follows Vimal Dwarampudi's Medium article "Spec-Driven AI"; where something is his opinion, I will say so.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a
      he: |
        ברוכים הבאים. AI זה בינה מלאכותית, והיום נדבר על רעיון אחד: כשבונים תוכנה עם עוזר קוד מבוסס AI, כמו Claude Code או Codex, כותבים קודם מה רוצים, ורק אז הוא כותב את הקוד. לזה קוראים Spec-Driven Development, או SDD. spec הוא פשוט תיאור כתוב של מה שהתוכנה צריכה לעשות.
        החלק התיאורטי מבוסס על המאמר של Vimal Dwarampudi ב-Medium, “Spec-Driven AI”; כשמשהו הוא דעה שלו, אגיד את זה.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a

  - id: hidden-questions
    part: "0"
    budget: "1:00"
    layout: bullets
    title: { en: "One prompt, many hidden questions", he: "prompt אחד, הרבה שאלות נסתרות" }
    bullets:
      - { key: prompt, en: "“Build a temperature monitor that warns when it’s too hot”", he: "“תבנה מוניטור טמפרטורה שמזהיר כשחם מדי”" }
      - { key: threshold, en: "Too hot means what? At the edge, does the warning flicker?", he: "מה זה “חם מדי”? ומה קורה על הגבול, האזהרה מהבהבת?" }
      - { key: sensor, en: "Which sensor? What if it stops answering?", he: "איזה חיישן? ומה קורה כשהוא מפסיק לענות?" }
      - { key: guess, en: "The AI answers all of these anyway, silently, by guessing", he: "ה-AI עונה על כולן בעצמו: בשקט, בניחוש" }
    tip: { key: ask-first, en: "List three questions the AI would have to guess, and answer them before prompting.", he: "רשמו שלוש שאלות שה-AI יצטרך לנחש, וענו עליהן לפני שאתם כותבים prompt." }
    notes:
      en: |
        Analogy: ordering a birthday cake by saying only "make it nice". You get a cake, but every decision you skipped, the baker made for you.
        The slide shows the request in short. The real prompt, word for word, was: "Build an application for a Heltec WiFi Kit V3 that reads a sensor, shows the value on the display, and shows a warning when the value is too high." Nothing else. It sounds complete.
        Now count the hidden questions. What does "too hot" mean? At the number, or just above it? If the temperature hovers at the edge, does the warning flicker? Which sensor, and what if it stops answering?
        The AI will not stop and ask. It answers every one of them anyway, silently, by guessing. This talk is about making those guesses visible.
      he: |
        Analogy: להזמין עוגת יום הולדת ולהגיד רק “שתהיה יפה”. תקבלו עוגה, אבל כל החלטה שדילגתם עליה, האופה קיבל במקומכם.
        בשקף רואים את הבקשה בקיצור. ה-prompt האמיתי, מילה במילה, היה: “תבנה אפליקציה ל-Heltec WiFi Kit V3 שקוראת חיישן, מציגה את הערך על המסך ומציגה אזהרה כשהערך גבוה מדי.” ותו לא. זה נשמע שלם.
        עכשיו בואו נספור את השאלות הנסתרות. מה זה “חם מדי”? בדיוק במספר, או קצת מעליו? אם הטמפרטורה מרחפת על הגבול, האזהרה מהבהבת? איזה חיישן, ומה קורה אם הוא מפסיק לענות?
        ה-AI לא יעצור לשאול. הוא יענה על כל אחת מהן בכל מקרה, בשקט, בניחוש. ההרצאה הזאת עוסקת בדרך לחשוף את הניחושים האלה.

  # ---------------------------------------------------------------- Part I
  - id: intent-gap
    part: I
    budget: "2:30"
    layout: bullets-diagram
    title: { en: "The intent gap: SDLC vs ADLC", he: "פער הכוונה: SDLC מול ADLC" }
    bullets:
      - { key: sdlc, en: "Old way: software development life cycle (SDLC), slow docs", he: "הדרך הישנה: SDLC (מחזור חיי פיתוח תוכנה), איטית" }
      - { key: adlc, en: "New way: ADLC (the article’s term), fast but literal", he: "הדרך החדשה: ADLC (מונח מהמאמר), מהירה אבל מבינה הכול מילולית" }
    diagram:
      name: sdlc-adlc
      labels:
        sdlc_title: { en: "SDLC: the old way", he: "SDLC: הדרך הישנה" }
        adlc_title: { en: "ADLC: agentic dev life cycle", he: "ADLC: מחזור פיתוח עם agents" }
        requirements: { en: "Requirements", he: "דרישות" }
        design: { en: "Design", he: "עיצוב" }
        build: { en: "Build", he: "בנייה" }
        test: { en: "Test", he: "בדיקות" }
        release: { en: "Release", he: "שחרור" }
        intent: { en: "Your intent", he: "הכוונה שלכם" }
        agent_builds: { en: "AI agent builds", he: "ה-AI agent בונה" }
        check: { en: "Check", he: "בדיקה" }
        correct: { en: "Correct", he: "תיקון" }
    sources: [article, F8]
    notes:
      en: |
        Analogy: a very fast translator who never asks what you meant. Every word you say is translated perfectly, including the words you got wrong.
        Start with the old way. For decades software followed the SDLC, the software development life cycle: requirements, design, code, test, release. People did every step, and slowly. The documents written at the start drifted out of date, but the slowness hid the problem, because a confused developer could walk over and ask.
        The article calls the new way the ADLC, roughly "agentic development life cycle". That is the author's framing, not an industry-standard term yet, but it is useful. An agent is an AI that can edit files and run commands on its own. It writes the code in minutes, and it builds from exactly what you typed. In the article's words, SDLC optimizes for human coordination; ADLC optimizes for autonomous execution with human oversight.
        Both share one unsolved problem: does what got built match what was intended? In the old world, requirement documents went stale before the ink dried. In early AI coding, the answer was "prompt harder". Neither worked reliably.
        So here is the intent gap: what you meant and what you typed are not the same thing. Humans used to fill that gap with conversation. The agent fills it with guesses, at high speed. The faster the builder, the faster that gap grows.
        The fix sounds almost boring: write the intent down first, in a form both people and the AI can read, and keep it up to date. Everything else today builds on that.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a
      he: |
        Analogy: מתרגם מהיר מאוד שאף פעם לא שואל למה התכוונתם. כל מילה שאתם אומרים מתורגמת בצורה מושלמת, כולל המילים שטעיתם בהן.
        נתחיל מהדרך הישנה. במשך עשורים, פיתוח תוכנה עבד לפי SDLC, מחזור חיי פיתוח התוכנה: דרישות, עיצוב, קוד, בדיקות, שחרור. אנשים עשו כל שלב, ולאט. המסמכים שנכתבו בהתחלה התיישנו, אבל האיטיות הסתירה את הבעיה, כי מפתח מבולבל יכול היה פשוט לקום ולשאול.
        המאמר קורא לדרך החדשה ADLC, בערך “agentic development life cycle”. זה הניסוח של הכותב, עדיין לא מונח מקובל בתעשייה, אבל הוא שימושי. agent הוא AI שיכול לערוך קבצים ולהריץ פקודות בעצמו. הוא כותב את הקוד בדקות, ובונה בדיוק את מה שהקלדתם. במילים של המאמר, SDLC מתמקד בתיאום בין אנשים, ו-ADLC מתמקד בביצוע אוטונומי עם פיקוח אנושי.
        לשתיהן יש בעיה פתוחה אחת: האם מה שנבנה תואם את מה שהתכוונו? בעולם הישן, מסמכי הדרישות התיישנו עוד לפני שהדיו התייבש. בימים הראשונים של קוד עם AI, התשובה הייתה “לכתוב prompt חזק יותר”. אף אחת מהן לא עבדה באמת.
        אז הנה פער הכוונה: מה שהתכוונתם ומה שהקלדתם הם לא אותו דבר. פעם אנשים סגרו את הפער הזה בשיחה. ה-agent סוגר אותו בניחושים, ובמהירות. ככל שהבונה מהיר יותר, הפער גדל מהר יותר.
        הפתרון נשמע כמעט משעמם: לכתוב את הכוונה קודם, בצורה שגם אנשים וגם ה-AI יכולים לקרוא, ולשמור אותה מעודכנת. כל השאר היום נבנה על זה.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a

  - id: vibe-vs-sdd
    part: I
    budget: "2:30"
    layout: compare
    title: { en: "Vibe coding vs SDD", he: "vibe coding מול SDD" }
    columns:
      - heading: { en: "Vibe coding: the napkin", he: "vibe coding: סקיצה על מפית" }
        items:
          - { en: "Prompt, accept, repeat until it seems to work", he: "כותבים prompt, מאשרים, וחוזר חלילה עד שזה נראה עובד" }
          - { en: "Decisions hide in a chat nobody rereads", he: "ההחלטות מתחבאות בצ'אט שאף אחד לא קורא שוב" }
          - { en: "Great for a quick throwaway prototype", he: "מצוין לאב-טיפוס מהיר שזורקים אחר כך" }
      - heading: { en: "SDD: the blueprint", he: "SDD: שרטוט של אדריכל" }
        items:
          - { en: "Write the intent, review it, then generate code", he: "כותבים את הכוונה, עוברים עליה, ורק אז מייצרים קוד" }
          - { en: "Decisions live in files the whole team reads", he: "ההחלטות חיות בקבצים שכל הצוות קורא" }
          - { en: "Built for code you will maintain next month", he: "מתאים לקוד שתתחזקו גם בחודש הבא" }
    tip: { key: pick-mode, en: "Explore with vibe coding; switch to a spec once the code has to last.", he: "לניסויים, vibe coding; כשהקוד צריך להחזיק לאורך זמן, עברו ל-spec." }
    notes:
      en: |
        Analogy: a napkin sketch versus an architect's blueprint. Both are drawings. You would never build a house from the napkin, and you would never draw a blueprint just to try out an idea.
        Vibe coding is the napkin. The term describes a way of working where you describe what you want, accept whatever the AI produces, run it, and keep prompting until it seems to work. You never really read the code. Your decisions live in a chat history that nobody, including you, will ever reread.
        And honestly, that is fine for a lot of things: a throwaway prototype, a script you will run once, checking whether an idea is even possible.
        Spec-driven development is the blueprint. You write the intent down first, you review it, and only then do you let the AI generate the code. The decisions live in plain files inside the project, next to the code, where the whole team can read them, review them, and change them.
        The difference shows up a month later. With vibe coding, someone asks why the warning triggers at 27 degrees, and the honest answer is: the AI picked it. With a spec, you open a file and the decision is there, with the reason next to it.
        So this is not good versus bad. It is a choice, and one question decides it: will this code need to survive? If yes, it deserves a spec.
        That is the tip on the slide: explore with vibe coding, and switch to a spec the moment the code has to last.
      he: |
        Analogy: סקיצה על מפית מול שרטוט של אדריכל. שניהם ציורים. לא בונים בית מהמפית, ולא משרטטים תוכנית אדריכלית רק כדי לנסות רעיון.
        vibe coding הוא המפית. זו דרך עבודה שבה מתארים מה רוצים, מקבלים את מה שה-AI מייצר, מריצים, וממשיכים לכתוב prompts עד שזה נראה עובד. אף פעם לא באמת קוראים את הקוד. ההחלטות שלכם חיות בהיסטוריית צ'אט שאף אחד, כולל אתם, לא יקרא שוב.
        ובכנות, זה בסדר גמור להרבה דברים: אב-טיפוס שזורקים, סקריפט שמריצים פעם אחת, בדיקה אם רעיון בכלל אפשרי.
        פיתוח מבוסס spec הוא השרטוט. כותבים את הכוונה קודם, בודקים אותה, ורק אז נותנים ל-AI לייצר את הקוד. ההחלטות חיות בקבצים פשוטים בתוך הפרויקט, ליד הקוד, שם כל הצוות יכול לקרוא אותן, לבדוק ולשנות.
        ההבדל מתגלה חודש אחרי. עם vibe coding, מישהו שואל למה האזהרה נדלקת ב-27 מעלות, והתשובה הכנה היא: ה-AI בחר. עם spec, פותחים קובץ וההחלטה שם, עם הסיבה לידה.
        אז זה לא טוב מול רע. זו בחירה, ושאלה אחת מכריעה: האם הקוד הזה צריך לשרוד? אם כן, מגיע לו spec.
        זה ה-TIP בשקף: חקרו עם vibe coding, ועברו ל-spec ברגע שהקוד צריך להחזיק מעמד.

  - id: sdd-core
    part: I
    budget: "2:30"
    layout: bullets-diagram
    title: { en: "SDD: the spec is the source of truth", he: "SDD: ה-spec הוא מקור האמת" }
    bullets:
      - { key: constitution, en: "The constitution: house rules every stage must obey", he: "ה-constitution (חוקי הבית): כללים שכל שלב חייב לציית להם" }
      - { key: loop, en: "Learned something? Update the spec, then regenerate", he: "למדתם משהו? מעדכנים את ה-spec ומייצרים מחדש" }
    diagram:
      name: sdd-pipeline
      labels:
        constitution: { en: "Constitution", he: "Constitution" }
        specify: { en: "Specify", he: "Specify" }
        plan: { en: "Plan", he: "Plan" }
        tasks: { en: "Tasks", he: "Tasks" }
        implement: { en: "Implement", he: "Implement" }
        clarify: { en: "Clarify", he: "Clarify" }
        analyze: { en: "Analyze", he: "Analyze" }
        feedback: { en: "Change? Update the spec", he: "שינוי? מעדכנים את ה-spec" }
        rail: { en: "House rules for every stage", he: "חוקי הבית לכל שלב" }
    tip: { key: one-truth, en: "Fix the spec first when code and spec disagree, then regenerate the code.", he: "כשהקוד וה-spec סותרים, תקנו קודם את ה-spec ורק אז ייצרו את הקוד מחדש." }
    sources: [article, F10]
    notes:
      en: |
        Analogy: a restaurant kitchen cooking from one recipe card. If the dish comes out wrong, you do not just fix the plate; you fix the recipe, so tomorrow's dish is right too.
        SDD makes the spec the source of truth. Not the code, and not the chat. The code is something the AI generates from the spec, and can generate again.
        The work moves through stages. The constitution comes first: the project's house rules, written once. In our hardware project, one rule is that the decision logic must be testable without the board. Then specify: what should the system do, for whom, and how will we know it works? Then plan: how will we build it? Then tasks: a numbered to-do list. Then implement: the AI writes the code.
        Spec Kit, GitHub's free toolkit that we will meet properly on slide 9, adds two checkpoints that matter a lot, drawn on the diagram as gates. Clarify asks you the questions the spec left open, one at a time, and records your answers. Analyze cross-checks the documents against each other before any code exists.
        Then the loop. When you learn something while building, a requirement changes or a test reveals a gap, you do not quietly patch the code. You update the spec, and regenerate from there. The article describes this feedback loop, with the constitution as a rail running underneath every stage.
        The constitution is not paperwork. Every later stage is checked against it, so you write the rules once and the AI respects them everywhere.
        The tip is the habit that makes all of this work: when the code and the spec disagree, fix the spec first.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a
      he: |
        Analogy: מטבח של מסעדה שמבשל מכרטיס מתכון אחד. אם המנה יוצאת לא טוב, לא מתקנים רק את הצלחת; מתקנים את המתכון, כדי שגם המנה של מחר תצא נכון.
        SDD הופך את ה-spec למקור האמת. לא הקוד ולא הצ'אט. הקוד הוא משהו שה-AI מייצר מה-spec, ויכול לייצר שוב.
        העבודה עוברת בשלבים. קודם ה-constitution: חוקי הבית של הפרויקט, שנכתבים פעם אחת. בפרויקט החומרה שלנו, אחד הכללים הוא שלוגיקת ההחלטות חייבת להיות ניתנת לבדיקה בלי הלוח. אחר כך specify: מה המערכת צריכה לעשות, בשביל מי, ואיך נדע שהיא עובדת? אחר כך plan: איך נבנה את זה? אחר כך tasks: רשימת משימות ממוספרת. ואז implement: ה-AI כותב את הקוד.
        Spec Kit, ערכת הכלים החינמית של GitHub שנכיר כמו שצריך בשקף 9, מוסיפה שתי נקודות ביקורת חשובות, שמסומנות בתרשים כשערים. clarify שואל אתכם את השאלות שה-spec השאיר פתוחות, אחת אחת, ורושם את התשובות. analyze בודק את המסמכים זה מול זה, עוד לפני שיש קוד.
        ואז הלולאה. כשלומדים משהו תוך כדי בנייה, דרישה משתנה או בדיקה חושפת פער, לא מתקנים את הקוד בשקט. מעדכנים את ה-spec, ומייצרים מחדש משם. המאמר מתאר את לולאת המשוב הזאת, עם ה-constitution כמסילה שעוברת מתחת לכל שלב.
        ה-constitution היא לא ניירת. כל שלב בהמשך נבדק מולה, אז כותבים את הכללים פעם אחת וה-AI מקפיד עליהם בכל מקום.
        ה-TIP הוא ההרגל שגורם לכל זה לעבוד: כשהקוד וה-spec סותרים, תקנו קודם את ה-spec.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a

  # ---------------------------------------------------------------- Part II
  - id: context-engineering
    part: II
    budget: "2:00"
    layout: bullets
    title: { en: "Context engineering: what the AI sees", he: "context engineering: מה ה-AI רואה" }
    bullets:
      - { key: desk, en: "The AI only knows what is on its desk right now", he: "ה-AI יודע רק מה שמונח על השולחן שלו עכשיו" }
      - { key: window, en: "That desk is the context window: prompt, files, chat so far", he: "השולחן הזה הוא ה-context window: ה-prompt, הקבצים, הצ'אט עד עכשיו" }
      - { key: curate, en: "Context engineering: choosing what goes on the desk", he: "context engineering: לבחור מה עולה על השולחן" }
      - { key: less, en: "Less but relevant beats more but noisy", he: "מעט ורלוונטי עדיף על הרבה ורועש" }
    tip: { key: point-files, en: "Point the agent at the exact files it needs, not the whole project.", he: "הפנו את ה-agent לקבצים המדויקים שהוא צריך, לא לכל הפרויקט." }
    notes:
      en: |
        Analogy: packing a small backpack for a day hike. You cannot take the whole house, so what you choose to pack decides how the day goes.
        Here is the intuition. The AI does not remember your project the way you do. At any moment it only sees what is on its desk: your instructions, the files it opened, and the conversation so far. That desk has a fixed size. The formal name is the context window, measured in tokens, which are roughly pieces of words.
        Everything the AI produces comes from what is on that desk. If an important decision is not on it, the AI does not know the decision exists. If the desk is buried in irrelevant files and old chat, the important thing is still there, just harder to notice.
        Context engineering is the skill of choosing what goes on the desk, on purpose: the spec, the plan, the two or three files that actually matter, and nothing else. It is the bigger cousin of prompt engineering. Prompt engineering is about how you phrase one request; context engineering is about everything the AI can see when it answers.
        This is also why SDD helps. A short spec and plan are the perfect things to put on the desk: dense, current and relevant.
        Rule of thumb: less but relevant beats more but noisy. And the tip: point the agent at the exact files it needs, instead of saying "look at the whole project".
      he: |
        Analogy: לארוז תיק קטן לטיול של יום. אי אפשר לקחת את כל הבית, אז מה שבוחרים לארוז קובע איך היום ייראה.
        הנה האינטואיציה. ה-AI לא זוכר את הפרויקט שלכם כמו שאתם זוכרים. בכל רגע הוא רואה רק מה שמונח על השולחן שלו: ההוראות שלכם, הקבצים שהוא פתח, והשיחה עד עכשיו. לשולחן הזה יש גודל קבוע. השם הרשמי הוא context window, והוא נמדד ב-tokens, שהם בערך חלקי מילים.
        כל מה שה-AI מייצר מגיע ממה שעל השולחן. אם החלטה חשובה לא נמצאת עליו, ה-AI לא יודע שהיא קיימת. אם השולחן קבור בקבצים לא רלוונטיים ובצ'אט ישן, הדבר החשוב עדיין שם, רק קשה יותר לשים לב אליו.
        context engineering זה לבחור בכוונה מה עולה על השולחן: ה-spec, ה-plan, שניים-שלושה הקבצים שבאמת חשובים, ותו לא. זה האח הגדול של prompt engineering. prompt engineering עוסק באיך מנסחים בקשה אחת; context engineering עוסק בכל מה שה-AI רואה כשהוא עונה.
        זו גם הסיבה ש-SDD עוזר. spec ו-plan קצרים הם בדיוק מה שכדאי לשים על השולחן: דחוסים, עדכניים ורלוונטיים.
        כלל אצבע: מעט ורלוונטי עדיף על הרבה ורועש. וה-TIP: הפנו את ה-agent לקבצים המדויקים שהוא צריך, במקום להגיד “תסתכל על כל הפרויקט”.

  - id: context-rot
    part: II
    budget: "2:30"
    layout: bullets-diagram
    title: { en: "Context rot: when the AI forgets", he: "context rot: כשה-AI שוכח" }
    bullets:
      - { key: long, en: "A long chat is a whiteboard that keeps filling up", he: "צ'אט ארוך הוא לוח מחיק שהולך ומתמלא" }
      - { key: quality, en: "Research: answers get less reliable as the input grows", he: "מחקר: התשובות נעשות פחות אמינות ככל שהקלט גדל" }
    diagram:
      name: context-rot
      labels:
        axis_quality: { en: "Answer quality", he: "איכות התשובות" }
        axis_context: { en: "Context filling up", he: "ה-context מתמלא" }
        rot_zone: { en: "Context rot", he: "Context rot" }
    tip: { key: fresh-session, en: "Start a fresh session when the AI forgets earlier decisions, and hand it the spec.", he: "פתחו session חדש כשה-AI שוכח החלטות קודמות, ותנו לו את ה-spec." }
    sources: [F7]
    notes:
      en: |
        Analogy: a whiteboard in a long meeting. By hour two it is full, the decision from minute five is squeezed into a corner under three other diagrams, and people start contradicting it without noticing.
        That is what happens in a long AI session. The context window keeps filling with old messages, failed attempts and files you no longer need. The early decisions are still technically there, but they get buried and quietly ignored.
        This has a name: context rot. And it is not just a feeling. In July 2025, researchers at Chroma, Kelly Hong, Anton Troynikov and Jeff Huber, tested 18 AI models and found that performance becomes less reliable as the input gets longer, even on simple tasks. An earlier paper by Nelson Liu and colleagues, "Lost in the Middle", showed that models use information at the start and the end of a long input much better than information in the middle.
        So quality drops long before the window is full, and a bigger window does not make the problem go away.
        What helps? Keep sessions short and focused. Write decisions into files, not only into the chat. And when the AI starts forgetting what you agreed, do not argue with it: start a fresh session and hand it the spec. A tool called GSD does this automatically for every task; we will meet it on slide 11.
        Sources:
        https://www.trychroma.com/research/context-rot
        https://arxiv.org/abs/2307.03172
      he: |
        Analogy: לוח מחיק בפגישה ארוכה. אחרי שעתיים הוא מלא, ההחלטה מהדקה החמישית דחוקה בפינה מתחת לשלושה ציורים אחרים, ואנשים מתחילים לסתור אותה בלי לשים לב.
        זה מה שקורה ב-session ארוך עם AI. ה-context window מתמלא בהודעות ישנות, בניסיונות שנכשלו ובקבצים שכבר לא צריך. ההחלטות מההתחלה עדיין שם, טכנית, אבל הן נקברות ונשכחות בשקט.
        לזה יש שם: context rot. וזו לא רק תחושה. ביולי 2025, חוקרים ב-Chroma, Kelly Hong, Anton Troynikov ו-Jeff Huber, בדקו 18 מודלי AI ומצאו שהביצועים נעשים פחות אמינים ככל שהקלט מתארך, גם במשימות פשוטות. מאמר קודם של Nelson Liu ועמיתיו, “Lost in the Middle”, הראה שמודלים משתמשים במידע שבתחילת קלט ארוך ובסופו הרבה יותר טוב מאשר במידע שבאמצע.
        אז האיכות יורדת הרבה לפני שהחלון מתמלא, וחלון גדול יותר לא פותר את הבעיה.
        מה עוזר? לשמור על sessions קצרים וממוקדים. לכתוב החלטות לקבצים, לא רק לצ'אט. וכשה-AI מתחיל לשכוח על מה הסכמתם, אל תתווכחו איתו: פתחו session חדש ותנו לו את ה-spec. כלי בשם GSD עושה את זה אוטומטית לכל משימה; נפגוש אותו בשקף 11.
        Sources:
        https://www.trychroma.com/research/context-rot
        https://arxiv.org/abs/2307.03172

  # ---------------------------------------------------------------- Part III
  - id: bmad
    part: III
    budget: "1:30"
    layout: bullets
    title: { en: "BMAD: an AI agile team", he: "BMAD: צוות agile של AI" }
    bullets:
      - { key: roles, en: "Agents play roles: analyst, product manager, architect, developer", he: "כל agent ממלא תפקיד: אנליסט, מנהל מוצר, ארכיטקט, מפתח" }
      - { key: docs, en: "Each role hands a written document to the next", he: "כל תפקיד מעביר מסמך כתוב לתפקיד הבא" }
      - { key: fit, en: "Fits bigger projects that need planning up front", he: "מתאים לפרויקטים גדולים שצריכים תכנון מראש" }
    tip: { key: roles-small, en: "Borrow only the roles you miss; a small project rarely needs the whole team.", he: "קחו רק את התפקידים שחסרים לכם; פרויקט קטן כמעט אף פעם לא צריך צוות שלם." }
    sources: [F1]
    notes:
      en: |
        Analogy: a film crew. The director, the camera operator and the editor each have one clear job, and they pass the work along in a known order.
        BMAD stands for Breakthrough Method for Agile AI-Driven Development. Its organizing idea is the agile team. Instead of one general-purpose AI assistant, you get several specialized agent roles, such as an analyst, a product manager, an architect, a developer and a tester. Each has a narrow job and its own focused context.
        The key feature is the handoff. Each role produces a written document, a brief, a requirements document, an architecture, user stories, and passes it to the next role. That leaves an audit trail of every decision.
        The article quotes a specific number of roles; we could not verify it, so I am not repeating it.
        In my reading, BMAD fits bigger projects that need serious planning up front. On a small project the full crew is overkill, which is the tip: borrow only the roles you actually miss.
        Source: https://github.com/bmad-code-org/BMAD-METHOD
      he: |
        Analogy: צוות צילום. לבמאי, לצלם ולעורך יש לכל אחד תפקיד אחד ברור, והם מעבירים את העבודה הלאה בסדר ידוע.
        BMAD הוא קיצור של Breakthrough Method for Agile AI-Driven Development. הרעיון המארגן שלו הוא צוות agile. במקום עוזר AI כללי אחד, מקבלים כמה תפקידי agent מתמחים, כמו אנליסט, מנהל מוצר, ארכיטקט, מפתח ובודק. לכל אחד תפקיד צר, וה-context הממוקד שלו.
        הדבר המרכזי הוא ההעברה. כל תפקיד מייצר מסמך כתוב, brief, מסמך דרישות, ארכיטקטורה, user stories, ומעביר אותו לתפקיד הבא. כך נשאר תיעוד של כל החלטה.
        המאמר מצטט מספר מסוים של תפקידים; לא הצלחנו לאמת אותו, אז אני לא חוזר עליו.
        לפי הקריאה שלי, BMAD מתאים לפרויקטים גדולים שצריכים תכנון רציני מראש. בפרויקט קטן, הצוות המלא מוגזם, וזה ה-TIP: קחו רק את התפקידים שבאמת חסרים לכם.
        Source: https://github.com/bmad-code-org/BMAD-METHOD

  - id: speckit
    part: III
    budget: "2:00"
    layout: table
    title: { en: "Spec Kit: the living spec", he: "Spec Kit: ה-spec החי" }
    table:
      header:
        - { en: "Stage", he: "שלב" }
        - { en: "You get", he: "מה מקבלים" }
        - { en: "It catches", he: "מה הוא תופס" }
      rows:
        - [ { en: "constitution", he: "constitution" }, { en: "constitution.md", he: "constitution.md" }, { en: "Rules broken silently", he: "כללים שמופרים בשקט" } ]
        - [ { en: "specify + clarify", he: "specify + clarify" }, { en: "spec.md", he: "spec.md" }, { en: "Guessed requirements", he: "דרישות שנוחשו" } ]
        - [ { en: "plan + tasks", he: "plan + tasks" }, { en: "plan.md, tasks.md", he: "plan.md, tasks.md" }, { en: "Wrong design, missing steps", he: "תכנון שגוי, צעדים חסרים" } ]
        - [ { en: "analyze", he: "analyze" }, { en: "A report", he: "דוח" }, { en: "Documents that disagree", he: "מסמכים שסותרים זה את זה" } ]
        - [ { en: "implement", he: "implement" }, { en: "Code and tests", he: "קוד ובדיקות" }, { en: "Code drifting from the spec", he: "קוד שסוטה מה-spec" } ]
    sources: [speckit]
    notes:
      en: |
        Analogy: getting a building permit. Each office stamps a different form, and each stamp exists to catch a different kind of mistake before anyone pours concrete.
        Spec Kit is GitHub's open-source toolkit for spec-driven development. Where BMAD organizes agents, Spec Kit organizes documents. The documents are the engine: each stage reads the previous document and writes the next one, all as plain Markdown files inside your project.
        Walk the table. The constitution catches rules being broken silently. Specify writes the spec, and clarify then asks you the questions it left open, so requirements are decided instead of guessed. Plan and tasks turn the spec into a design and a numbered to-do list, which catches a wrong design or missing steps. Analyze cross-checks all the documents against each other and against the constitution; it catches documents that disagree. Implement writes the code and the tests by following the task list, so the code stays tied to the spec.
        The idea to remember: every stage catches a different kind of mistake, and each one is cheap to fix at that stage and expensive later.
        Spec Kit works with several AI coding assistants, including Claude Code and Codex, and its files do not depend on any one of them. Switch assistants mid-project and the spec stays.
        This is the tool we used in the case study, so you will see these stages for real in a few minutes.
        Source: https://github.com/github/spec-kit
      he: |
        Analogy: להוציא היתר בנייה. כל משרד מחתים טופס אחר, וכל חותמת קיימת כדי לתפוס סוג אחר של טעות, לפני שמישהו יוצק בטון.
        Spec Kit היא ערכת כלים בקוד פתוח של GitHub לפיתוח מבוסס spec. איפה ש-BMAD מארגן agents, Spec Kit מארגנת מסמכים. המסמכים הם המנוע: כל שלב קורא את המסמך הקודם וכותב את הבא, הכול כקבצי Markdown פשוטים בתוך הפרויקט.
        נעבור על הטבלה. ה-constitution תופסת כללים שמופרים בשקט. specify כותב את ה-spec, ו-clarify שואל אתכם את השאלות שנשארו פתוחות, כך שהדרישות מוגדרות ולא מנוחשות. plan ו-tasks הופכים את ה-spec לתכנון ולרשימת משימות ממוספרת, וזה תופס תכנון שגוי או צעדים חסרים. analyze בודק את כל המסמכים זה מול זה ומול ה-constitution; הוא תופס מסמכים שסותרים זה את זה. implement כותב את הקוד והבדיקות לפי רשימת המשימות, כך שהקוד נשאר קשור ל-spec.
        הרעיון לזכור: כל שלב תופס סוג אחר של טעות, וכל טעות זולה לתיקון בשלב הזה ויקרה אחר כך.
        Spec Kit עובדת עם כמה עוזרי קוד, כולל Claude Code ו-Codex, והקבצים שלה לא תלויים באף אחד מהם. מחליפים עוזר באמצע הפרויקט, וה-spec נשאר.
        זה הכלי שהשתמשנו בו ב-case study, אז תראו את השלבים האלה באמת בעוד כמה דקות.
        Source: https://github.com/github/spec-kit

  - id: superpowers
    part: III
    budget: "1:30"
    layout: bullets
    title: { en: "Superpowers: discipline the AI can't skip", he: "Superpowers: משמעת שה-AI לא יכול לדלג עליה" }
    bullets:
      - { key: skills, en: "A pilot’s checklist for the agent: skills it must follow", he: "כמו checklist של טייס: skills שה-agent חייב לעבוד לפיהם" }
      - { key: flow, en: "A 7-step workflow, from brainstorming to merge", he: "workflow של 7 שלבים, מ-brainstorming ועד merge" }
      - { key: tdd, en: "TDD (test-driven development): code before its test is deleted", he: "TDD (פיתוח מונחה בדיקות): קוד שנכתב לפני הבדיקה שלו נמחק" }
      - { key: verify, en: "Two reviews: does it match the spec? Is the code good?", he: "שני reviews: האם זה תואם ל-spec? האם הקוד טוב?" }
    tip: { key: tdd-habit, en: "Ask for a failing test first, then only the code that makes it pass.", he: "בקשו קודם בדיקה שנכשלת, ורק אז את הקוד שגורם לה לעבור." }
    sources: [F2, F3, F5]
    notes:
      en: |
        Analogy: a pilot's pre-flight checklist. Pilots are not short on skill. They read the checklist out loud on every flight because skipped steps are how accidents happen.
        Superpowers, created by Jesse Vincent, starts from a simple insight: the problem with AI coding is not intelligence, it is discipline. It is a library of skills, written procedures, that the agent must follow.
        Its README describes a seven-step workflow, from brainstorming the design, through an approved spec and a plan, to building, review and merge. The strictest part is TDD, test-driven development: first write a test that fails, then write just enough code to make it pass. Superpowers enforces this literally: code written before its test gets deleted.
        Then the work passes two reviews: first, does it match the spec? Second, is the code itself good?
        On adoption: the repository has over 300,000 GitHub stars as of November 2026 (github.com/obra/superpowers). The article's "170k in three months" figure does not match the record, so I am not repeating it.
        Tip: ask for a failing test first, then only the code that makes it pass.
        Source: https://github.com/obra/superpowers
      he: |
        Analogy: checklist של טייס לפני המראה. לטייסים לא חסר ניסיון. הם מקריאים את ה-checklist בקול בכל טיסה, כי שלבים שמדלגים עליהם הם הדרך שבה קורות תאונות.
        Superpowers, שנוצר על ידי Jesse Vincent, יוצא מתובנה פשוטה: הבעיה של קוד עם AI היא לא אינטליגנציה, אלא משמעת. זו ספרייה של skills, נהלים כתובים, שה-agent חייב לפעול לפיהם.
        ה-README שלו מתאר workflow של שבעה שלבים, מ-brainstorming על העיצוב, דרך spec מאושר ו-plan, ועד בנייה, review ו-merge. החלק הכי קשוח הוא TDD, פיתוח מונחה בדיקות: קודם כותבים בדיקה שנכשלת, ואז רק מספיק קוד כדי שתעבור. Superpowers אוכף את זה מילולית: קוד שנכתב לפני הבדיקה שלו נמחק.
        אחר כך העבודה עוברת שני reviews: קודם, האם היא תואמת ל-spec? ושנית, האם הקוד עצמו טוב?
        לגבי אימוץ: ל-repository יש יותר מ-300,000 כוכבים ב-GitHub נכון לנובמבר 2026 (github.com/obra/superpowers). המספר במאמר, “170 אלף בשלושה חודשים”, לא תואם את הנתונים, אז אני לא חוזר עליו.
        TIP: בקשו קודם בדיקה שנכשלת, ורק אז את הקוד שגורם לה לעבור.
        Source: https://github.com/obra/superpowers

  - id: two-layers
    part: III
    budget: "2:30"
    layout: bullets-diagram
    title: { en: "Four metaphors, two layers", he: "ארבע מטאפורות, שתי שכבות" }
    bullets:
      - { key: layers, en: "Planning says what to build; execution keeps it on track", he: "התכנון קובע מה בונים; הביצוע דואג שהעבודה לא תסטה" }
    diagram:
      name: layers
      labels:
        band_plan: { en: "Planning: what to build", he: "תכנון: מה לבנות" }
        band_exec: { en: "Execution: build it reliably", he: "ביצוע: בנייה אמינה" }
        bmad: { en: "BMAD: the team", he: "BMAD: הצוות" }
        speckit: { en: "Spec Kit: the living spec", he: "Spec Kit: ה-spec החי" }
        gsd: { en: "GSD: fresh context", he: "GSD: context נקי" }
        superpowers: { en: "Superpowers: discipline", he: "Superpowers: משמעת" }
    sources: [article, F9]
    notes:
      en: |
        Analogy: building a house needs an architect and a site foreman. The architect decides what to build; the foreman keeps the work on track every day. Neither replaces the other.
        Here are the four frameworks on one picture, each with its metaphor. BMAD is the team. Spec Kit is the living document. GSD, short for "Get Sh*t Done", is fresh context: every task gets a new agent with a clean context window, so long projects never rot; there is a backup slide on it if anyone asks. Superpowers is discipline.
        They sit in two layers. The top layer is planning and governance: what are we building, why, and under which rules? That is BMAD and Spec Kit. The bottom layer is execution discipline: how do we build it reliably, for hours, without the AI drifting or skipping tests? That is GSD and Superpowers.
        This is the article's most useful idea: these tools are not competitors. Planning tools do not solve context rot; a planning agent can drift in a long session like any other. And none of the planning tools enforce TDD at the moment the code is written.
        There is real overlap too. Spec Kit's acceptance checklist is a light quality gate, and BMAD has a tester role, so on smaller projects with careful human review, the planning layer may be enough on its own.
        The author goes further: he writes that mature teams are converging on all four. That is his opinion. I would rather give you a rule for deciding, and that is the next slide.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a
      he: |
        Analogy: כדי לבנות בית צריך אדריכל ומנהל עבודה. האדריכל מחליט מה בונים; מנהל העבודה דואג שהעבודה תתקדם כמו שצריך, כל יום. אף אחד מהם לא מחליף את השני.
        הנה ארבעת ה-frameworks בתמונה אחת, כל אחד עם המטאפורה שלו. BMAD הוא הצוות. Spec Kit היא המסמך החי. GSD, קיצור של “Get Sh*t Done”, הוא context נקי: כל משימה מקבלת agent חדש עם context window נקי, כך שפרויקטים ארוכים לא נרקבים; יש עליו שקף גיבוי אם מישהו שואל. Superpowers הוא משמעת.
        הם יושבים בשתי שכבות. השכבה העליונה היא תכנון ומשילות: מה בונים, למה, ולפי אילו כללים? זה BMAD ו-Spec Kit. השכבה התחתונה היא משמעת ביצוע: איך בונים באמינות, במשך שעות, בלי שה-AI יסטה או ידלג על בדיקות? זה GSD ו-Superpowers.
        זה הרעיון הכי שימושי במאמר: הכלים האלה לא מתחרים זה בזה. כלי תכנון לא פותרים context rot; agent של תכנון יכול לסטות ב-session ארוך כמו כל אחד אחר. ואף אחד מכלי התכנון לא אוכף TDD ברגע שהקוד נכתב.
        יש גם חפיפה אמיתית. ה-checklist של Spec Kit הוא שער איכות קל, ול-BMAD יש תפקיד של בודק, אז בפרויקטים קטנים עם review אנושי קפדני, שכבת התכנון לבדה אולי מספיקה.
        הכותב הולך רחוק יותר: הוא כותב שצוותים בוגרים מתכנסים לשימוש בכל הארבעה. זו דעה שלו. אני מעדיף לתת לכם כלל להחלטה, וזה השקף הבא.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a

  - id: decision-rule
    part: III
    budget: "3:00"
    layout: bullets-diagram
    title: { en: "Decision rule: which layers do you need?", he: "איך מחליטים: אילו שכבות צריך?" }
    diagram:
      name: decision
      labels:
        track_context: { en: "Context layer: GSD", he: "שכבת context: GSD" }
        track_discipline: { en: "Discipline layer: Superpowers", he: "שכבת משמעת: Superpowers" }
        q_long: { en: "Long sessions?", he: "sessions ארוכים?" }
        q_review: { en: "Human review each phase?", he: "בדיקה אנושית בכל שלב?" }
        q_tdd: { en: "Strong TDD habit?", he: "רגילים לעבוד עם TDD?" }
        add_gsd: { en: "Add GSD", he: "הוסיפו GSD" }
        skip_gsd: { en: "Skip GSD", he: "ותרו על GSD" }
        add_superpowers: { en: "Add Superpowers", he: "הוסיפו Superpowers" }
        skip_superpowers: { en: "Skip Superpowers", he: "ותרו על Superpowers" }
        "yes": { en: "yes", he: "כן" }
        "no": { en: "no", he: "לא" }
    tip: { key: start-speckit, en: "Start with one planning tool; add a layer only when you feel its pain.", he: "התחילו עם כלי תכנון אחד; הוסיפו שכבה רק כשאתם נתקלים בבעיה שהיא פותרת." }
    sources: [article]
    notes:
      en: |
        Analogy: choosing a vehicle. You do not buy a truck for a short commute, and you do not move house on a bicycle. The trip decides the vehicle.
        This is the article's practical decision rule, drawn as two simple tracks. Start with a planning tool, for example Spec Kit, then ask three questions.
        First track, the context layer, GSD. Question one: are your AI sessions long, hours of work on their own? If yes, add GSD, because you will hit context rot. If no, ask question two: does a human review the output after each phase? If nobody does, add GSD. If you review every phase, skip it; each review is a natural checkpoint.
        Second track, the discipline layer, Superpowers. Question three: does your team have a strong TDD habit that survives deadline pressure? If no, add Superpowers and let the tool enforce it. If yes, skip it.
        Let's try the rule on the project you are about to see, the Heltec temperature monitor. Question one: were the sessions long? No; each Spec Kit stage was a short, focused session. Question two: did a human review each phase? Yes; I read and approved every document before the next stage started. So the context track says: skip GSD. Question three: a strong TDD habit? Here the habit was written into the project's constitution: Principle II says every threshold and state change needs a test written before or alongside the code. So the discipline track says: skip Superpowers too. Spec Kit alone, plus a human, was the right size for that job.
        One more honest answer: sometimes you need none of this. Adapted from the companion textbook's chapter "When Not to Use Spec Kit" (docs/textbook.md, section 22): skip the spec for throwaway experiments you will delete, for trivial and unambiguous changes like renaming a variable, and when you do not yet know what is technically possible and need to explore first. That is research, not specification.
        Spec-driven development earns its cost when getting the requirement wrong is expensive.
        Tip: start with one planning tool, and add a layer only when you feel its pain.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a
      he: |
        Analogy: לבחור רכב. לא קונים משאית לנסיעה קצרה לעבודה, ולא עוברים דירה על אופניים. הנסיעה קובעת את הרכב.
        זה כלל ההחלטה המעשי מהמאמר, מצויר כשני מסלולים פשוטים. מתחילים עם כלי תכנון, למשל Spec Kit, ואז שואלים שלוש שאלות.
        מסלול ראשון, שכבת ה-context, GSD. שאלה אחת: ה-sessions שלכם עם ה-AI ארוכים, שעות של עבודה עצמאית? אם כן, הוסיפו GSD, כי תיתקלו ב-context rot. אם לא, שאלה שתיים: האם אדם עושה review לתוצר אחרי כל שלב? אם אף אחד לא, הוסיפו GSD. אם אתם בודקים כל שלב, ותרו עליו; כל review הוא נקודת ביקורת טבעית.
        מסלול שני, שכבת המשמעת, Superpowers. שאלה שלוש: יש לצוות הרגל TDD חזק, ששורד לחץ של דדליין? אם לא, הוסיפו Superpowers ותנו לכלי לאכוף אותו. אם כן, ותרו.
        בואו ננסה את הכלל על הפרויקט שתראו עוד רגע, מוניטור הטמפרטורה של Heltec. שאלה אחת: ה-sessions היו ארוכים? לא; כל שלב של Spec Kit היה session קצר וממוקד. שאלה שתיים: אדם בדק כל שלב? כן; קראתי ואישרתי כל מסמך לפני שהשלב הבא התחיל. אז מסלול ה-context אומר: ותרו על GSD. שאלה שלוש: הרגל TDD חזק? כאן ההרגל נכתב לתוך ה-constitution של הפרויקט: עיקרון II קובע שלכל סף ולכל שינוי מצב צריכה להיות בדיקה, שנכתבת לפני הקוד או יחד איתו. אז מסלול המשמעת אומר: ותרו גם על Superpowers. Spec Kit לבד, יחד עם אדם, היה בדיוק בגודל הנכון לעבודה הזאת.
        ועוד תשובה כנה: לפעמים לא צריך שום דבר מזה. בהשראת הפרק “When Not to Use Spec Kit” בספר הלימוד הנלווה (docs/textbook.md, סעיף 22): ותרו על spec בניסויים שתזרקו, בשינויים טריוויאליים וחד-משמעיים כמו שינוי שם של משתנה, וכשאתם עוד לא יודעים מה אפשרי טכנית וצריכים קודם לחקור. זה מחקר, לא כתיבת spec.
        פיתוח מבוסס spec מצדיק את המחיר שלו כשטעות בדרישה עולה ביוקר.
        TIP: התחילו עם כלי תכנון אחד, והוסיפו שכבה רק כשאתם נתקלים בבעיה שהיא פותרת.
        Source: https://vimal-dwarampudi.medium.com/spec-driven-ai-bmad-speckit-gsd-superpowers-2cae4512819a

  # ---------------------------------------------------------------- Part IV
  - id: heltec-board
    part: IV
    budget: "1:30"
    layout: compare
    title: { en: "Heltec board + DHT22: implicit vs explicit", he: "לוח Heltec עם DHT22: מרומז מול מפורש" }
    columns:
      - heading: { en: "Implicit: the prompt", he: "מרומז: ה-prompt" }
        items:
          - { en: "Show the temperature on the screen", he: "להציג את הטמפרטורה על המסך" }
          - { en: "Warn when it gets too hot", he: "להזהיר כשחם מדי" }
          - { en: "(nothing about failures)", he: "(שום דבר על תקלות)" }
      - heading: { en: "Explicit: the spec", he: "מפורש: ה-spec" }
        items:
          - { en: "Read the DHT22 every 2 s, temperature only", he: "לקרוא את ה-DHT22 כל 2 שניות, טמפרטורה בלבד" }
          - { en: "WARNING above 27 °C, back to OK below 25 °C", he: "WARNING מעל 27 °C, חזרה ל-OK מתחת\u00a0ל-25 °C" }
          - { en: "3 failed reads in a row → SENSOR ERROR", he: "3 קריאות כושלות ברצף: SENSOR ERROR" }
    notes:
      en: |
        Analogy: see slide 2, the cake order. Same request, now with the real answers written down.
        Let's watch the theory work on something real. The board is a Heltec WiFi Kit V3: a small ESP32-S3 microcontroller board with a tiny built-in 0.96-inch OLED screen, an organic LED display. It has no temperature sensor of its own, which is the first thing the vague prompt left open. We wired a DHT22, a cheap temperature and humidity sensor, to pin 4, a general-purpose input/output pin.
        On the left is everything the one-line prompt said: show the temperature, warn when it is too hot. And nothing at all about failures.
        On the right is what the spec says after the Spec Kit stages: read the DHT22 every two seconds, temperature only. Enter WARNING above 27 °C, return to OK only below 25 °C. After three failed reads in a row, show SENSOR ERROR instead of a frozen number.
        The firmware also supports a BME280 sensor, chosen at build time, but everything you will see today ran on the DHT22.
      he: |
        Analogy: ראו שקף 2, הזמנת העוגה. אותה בקשה, הפעם עם התשובות האמיתיות בכתב.
        בואו נראה את התיאוריה עובדת על משהו אמיתי. הלוח הוא Heltec WiFi Kit V3: לוח מיקרו-בקר קטן מבוסס ESP32-S3, עם מסך OLED מובנה וזעיר של 0.96 אינץ', כלומר תצוגת LED אורגנית. אין לו חיישן טמפרטורה משלו, וזה הדבר הראשון שה-prompt המעורפל השאיר פתוח. חיברנו DHT22, חיישן זול של טמפרטורה ולחות, לפין 4, פין קלט/פלט כללי.
        בעמודה של ה-prompt, כל מה שה-prompt בן השורה האחת אמר: להציג את הטמפרטורה, להזהיר כשחם מדי. ושום דבר על תקלות.
        בעמודה של ה-spec, מה שכתוב אחרי שלבי Spec Kit: לקרוא את ה-DHT22 כל שתי שניות, טמפרטורה בלבד. להיכנס ל-WARNING מעל 27 °C, ולחזור ל-OK רק מתחת ל-25 °C. אחרי שלוש קריאות כושלות ברצף, להציג SENSOR ERROR במקום מספר קפוא.
        ה-firmware תומך גם בחיישן BME280, שנבחר בזמן ה-build, אבל כל מה שתראו היום רץ על ה-DHT22.

  - id: specify-hysteresis
    part: IV
    budget: "1:30"
    layout: code
    title: { en: "Specify: hysteresis decided, not guessed", he: "specify: ה-hysteresis הוגדר, לא נוחש" }
    bullets:
      - { key: question, en: "Specify wrote an on/off band; clarify asked: exactly at the edge?", he: "specify הגדיר טווח הדלקה וכיבוי; clarify שאל: ומה קורה בדיוק על הגבול?" }
      - { key: answer, en: "Decided: on above 27 °C, off below 25 °C, strictly", he: "הוחלט: נדלק רק מעל 27 °C, כבה רק מתחת ל-25 °C" }
    code: |
      FR-003: Enter WARNING when temperature
              is strictly above 27.0 °C.
      FR-004: Leave WARNING only when it is
              strictly below 25.0 °C.
              No toggling in [25.0 °C, 27.0 °C].
    tip: { key: edge-cases, en: "Ask about the edges: exactly at the threshold, sensor missing, first boot.", he: "שאלו על מקרי הקצה: בדיוק על הסף, חיישן חסר, הפעלה ראשונה." }
    notes:
      en: |
        Analogy: a home thermostat. The heating turns on at 19 degrees and off at 21, not both at 20, otherwise it would click on and off all day.
        Writing the code for a warning is trivial; deciding it is the hard part. With a single threshold, a reading hovering at the limit would flip the warning on and off every two seconds.
        The specify stage turned "too hot" into an explicit band: one number to switch the warning on, a lower one to switch it off, and in between the state stays as it was. That gap is called hysteresis. On the slide they are FR-003 and FR-004; FR means functional requirement, numbered so tests and tasks can point to it.
        Then clarify asked what nobody had thought about: what happens at exactly the threshold? Our answer: strictly. Exactly 27.0 does not trigger; exactly 25.0 does not clear.
        The first band was 30 and 28 °C. During hardware bring-up we lowered it so a cupped hand can trigger the warning, and recorded that as a new clarification, not a quiet code edit.
        Tip: ask about the edges, exactly at the threshold, sensor missing, first boot.
      he: |
        Analogy: תרמוסטט בבית. החימום נדלק ב-19 מעלות ונכבה ב-21, לא שניהם ב-20, אחרת הוא היה מקליק כל היום.
        לכתוב קוד לאזהרה זה טריוויאלי; להחליט עליה זה החלק הקשה. עם סף אחד, קריאה שמרחפת על הגבול הייתה מדליקה ומכבה את האזהרה כל שתי שניות.
        שלב ה-specify הפך את “חם מדי” לפס מפורש: מספר אחד שמדליק את האזהרה, מספר נמוך יותר שמכבה אותה, וביניהם המצב נשאר כמו שהיה. הרווח הזה נקרא hysteresis. בשקף אלה FR-003 ו-FR-004; FR זה functional requirement, דרישה פונקציונלית, ממוספרת כדי שבדיקות ומשימות יוכלו להפנות אליה.
        אחר כך clarify שאל משהו שאף אחד לא חשב עליו: מה קורה בדיוק על הסף? התשובה שלנו: רק מעל, ורק מתחת. בדיוק 27.0 לא מדליק; בדיוק 25.0 לא מכבה.
        הפס הראשון היה 30 ו-28 °C. בזמן העלאת החומרה הורדנו אותו, כדי שיד סגורה סביב החיישן תדליק את האזהרה, ותיעדנו את זה כ-clarification חדש, לא כשינוי שקט בקוד.
        TIP: שאלו על מקרי הקצה: בדיוק על הסף, חיישן חסר, הפעלה ראשונה.

  - id: plan-tested
    part: IV
    budget: "1:30"
    layout: code
    title: { en: "Plan + tested logic (11/11)", he: "plan ולוגיקה בדוקה (11/11)" }
    bullets:
      - { key: pure, en: "Plan: keep the decisions apart from the hardware code", he: "plan: להפריד את ההחלטות מקוד החומרה" }
      - { key: tests, en: "So 11 tests run on a laptop, no board needed: 11/11 pass", he: "וכך 11 בדיקות רצות על לפטופ, בלי לוח: 11/11 עוברות" }
    code: |
      $ pio test -e native
      test_warning_triggers_strictly_above_27 [PASSED]
      test_exactly_27_does_not_trigger_warning [PASSED]
      test_no_toggling_anywhere_inside_hysteresis_band [PASSED]
      test_third_consecutive_failure_enters_sensor_error [PASSED]
      ... 7 more [PASSED]
      11 test cases: 11 succeeded
    notes:
      en: |
        Analogy: a flight simulator. Pilots practise their decisions without a real plane; we test our decision logic without the real board.
        The plan's most important choice came straight from the constitution: keep the decision logic, the state machine that picks OK, WARNING or SENSOR ERROR, separate from all hardware code. The sensor, the screen and the serial output are thin adapters around it: small pieces of code whose only job is to talk to the hardware and pass plain numbers in and out, with no decisions of their own.
        That separation pays off immediately. The logic has eleven unit tests that run on a laptop with no board attached. They check every rule we just decided: warning strictly above 27, exactly 27 does nothing, clears strictly below 25, no toggling anywhere inside the band, three failures to enter SENSOR ERROR, and recovery afterwards.
        The command on the slide, pio, is PlatformIO's command-line tool; "native" means run the tests on this computer instead of the board. Result: 11 out of 11 pass. The output on the slide is shortened; the full run lists all eleven.
        Without the plan stage, the easy path is to call the sensor library straight from the logic, and then nothing can be tested without hardware on the desk.
      he: |
        Analogy: סימולטור טיסה. טייסים מתרגלים החלטות בלי מטוס אמיתי; אנחנו בודקים את לוגיקת ההחלטות בלי הלוח האמיתי.
        ההחלטה הכי חשובה ב-plan הגיעה ישר מה-constitution: להפריד את לוגיקת ההחלטות, ה-state machine שבוחרת בין OK, WARNING ו-SENSOR ERROR, מכל קוד החומרה. החיישן, המסך והפלט הטורי הם adapters דקים סביבה: חתיכות קוד קטנות שכל תפקידן לדבר עם החומרה ולהעביר מספרים פשוטים פנימה והחוצה, בלי שום החלטה משלהן.
        ההפרדה הזאת משתלמת מיד. ללוגיקה יש אחת עשרה בדיקות יחידה שרצות על לפטופ, בלי לוח מחובר. הן בודקות כל כלל שהחלטנו: אזהרה רק מעל 27, בדיוק 27 לא עושה כלום, כיבוי רק מתחת ל-25, שום הבהוב בתוך הפס, שלוש תקלות כדי להיכנס ל-SENSOR ERROR, והתאוששות אחר כך.
        הפקודה בשקף, pio, היא כלי שורת הפקודה של PlatformIO; native אומר להריץ את הבדיקות על המחשב הזה במקום על הלוח. התוצאה: 11 מתוך 11 עוברות. הפלט בשקף מקוצר; הריצה המלאה מציגה את כל האחת עשרה.
        בלי שלב ה-plan, הדרך הקלה היא לקרוא לספריית החיישן ישר מהלוגיקה, ואז שום דבר לא ניתן לבדיקה בלי חומרה על השולחן.

  - id: analyze-caught
    part: IV
    budget: "1:30"
    layout: table
    title: { en: "What /speckit-analyze caught", he: "מה /speckit-analyze תפס" }
    table:
      header:
        - { en: "Finding", he: "ממצא" }
        - { en: "Fixed before coding", he: "תוקן לפני כתיבת הקוד" }
      rows:
        - [ { en: "HIGH: error shown after 1 read, or 3?", he: "HIGH: שגיאה מוצגת אחרי קריאה 1, או 3?" }, { en: "Spec reworded: within 3 reads", he: "ה-spec נוסח מחדש: תוך 3 קריאות" } ]
        - [ { en: "MEDIUM: “never crash” rule had no test", he: "MEDIUM: לכלל “לא לקרוס” לא הייתה בדיקה" }, { en: "Added a long failure-run test", he: "נוספה בדיקה של רצף תקלות ארוך" } ]
        - [ { en: "MEDIUM: hardware-free rule not checked", he: "MEDIUM: הכלל “בלי חומרה” לא נבדק" }, { en: "Added a task to check it", he: "נוספה משימה שבודקת אותו" } ]
    notes:
      en: |
        Analogy: a proofreader who reads chapter 2 and chapter 9 side by side, and notices they describe two different endings.
        Analyze does not read code. It cross-checks every requirement, success criterion and task against each other, and against the constitution.
        In this project it found a real contradiction, marked HIGH. During clarify we had decided that a single glitch should not declare the sensor dead: three failed reads in a row are needed. But an older success criterion in the same file still promised the error would be visible within one reading. Two sentences, one file, two different devices.
        We fixed the wording to "within three readings" before any code was written. Analyze also flagged two medium gaps: the "never crash" rule had no automated test, and the hardware-free rule was not checked automatically. We added tasks for both.
        None of these is a coding bug. They are disagreements in our own requirements, caught while fixing them cost one sentence.
      he: |
        Analogy: מגיה שקורא את פרק 2 ואת פרק 9 זה לצד זה, ושם לב שהם מתארים שני סופים שונים.
        analyze לא קורא קוד. הוא בודק כל דרישה, כל קריטריון הצלחה וכל משימה זה מול זה, ומול ה-constitution.
        בפרויקט הזה הוא מצא סתירה אמיתית, בדרגת HIGH. ב-clarify החלטנו שתקלה בודדת לא מספיקה כדי להכריז שהחיישן מת: צריך שלוש קריאות כושלות ברצף. אבל קריטריון הצלחה ישן יותר באותו קובץ עדיין הבטיח שהשגיאה תוצג תוך קריאה אחת. שני משפטים, קובץ אחד, שתי התנהגויות שונות.
        תיקנו את הניסוח ל“תוך שלוש קריאות” לפני שנכתבה שורת קוד אחת. analyze סימן גם שני פערים בינוניים: לכלל “לא לקרוס” לא הייתה בדיקה אוטומטית, והכלל של לוגיקה בלי חומרה לא נבדק אוטומטית. הוספנו משימות לשניהם.
        אף אחד מאלה הוא לא באג בקוד. אלה סתירות בדרישות שלנו עצמן, שנתפסו כשהתיקון עלה משפט אחד.

  - id: behavior-photos
    part: IV
    budget: "2:00"
    layout: photos
    title: { en: "Behavior: OK and WARNING on the board", he: "התנהגות: OK ו-WARNING על הלוח" }
    images:
      - { file: photo-ok.jpg, caption: { en: "OK at 24.0 °C", he: "OK ב-24.0 °C" } }
      - { file: photo-warning.jpg, caption: { en: "WARNING at 26.6 °C: held by hysteresis", he: "WARNING ב-26.6 °C: נשאר בגלל ה-hysteresis" } }
    tip: { key: photo-proof, en: "Photograph real hardware results; reviewers trust a photo faster than a log.", he: "צלמו את התוצאות על החומרה האמיתית; ל-reviewer קל יותר להאמין לתמונה מאשר ל-log." }
    notes:
      en: |
        Analogy: see slide 14, the thermostat. These photos show it working.
        Pause about 10 seconds on each photo so people can read the screen.
        This is the real board with the DHT22 wired up. On the left, normal room temperature: the screen shows OK and 24.0 degrees.
        On the right, I warmed the sensor with my hand. Look closely at the number: 26.6 degrees, and the screen still says WARNING. A beginner might call that a bug, because 26.6 is below the 27-degree threshold. It is not a bug; it is the spec. The reading went above 27, the warning switched on, and it stays on until the temperature drops below 25. That is the hysteresis band from three slides ago, visible on real hardware.
        This is why the photos matter. The unit tests proved the logic on a laptop; the photos prove the same behavior on the physical device, with the real sensor. We use photos instead of a live demo on purpose: they never fail on stage.
        And what did we not need? GSD or Superpowers. The sessions were short and a human reviewed every stage, so the decision rule says skip GSD. And the constitution already required tests first (Principle II), so the Superpowers question also says skip.
        Tip: photograph real hardware results; reviewers trust a photo faster than a log.
      he: |
        Analogy: ראו שקף 14, התרמוסטט. התמונות האלה מראות אותו עובד.
        עצרו בערך 10 שניות על כל תמונה, כדי שאנשים יספיקו לקרוא את המסך.
        זה הלוח האמיתי, עם ה-DHT22 מחובר. בתמונת ה-OK, טמפרטורת חדר רגילה: המסך מציג OK ו-24.0 מעלות.
        בתמונת ה-WARNING, חיממתי את החיישן ביד. תסתכלו טוב על המספר: 26.6 מעלות, והמסך עדיין אומר WARNING. מי שרק מתחיל היה קורא לזה באג, כי 26.6 מתחת לסף של 27. זה לא באג; זה ה-spec. הקריאה עלתה מעל 27, האזהרה נדלקה, והיא נשארת דלוקה עד שהטמפרטורה יורדת מתחת ל-25. זה פס ה-hysteresis משלושה שקפים קודם, גלוי על חומרה אמיתית.
        בגלל זה התמונות חשובות. בדיקות היחידה הוכיחו את הלוגיקה על לפטופ; התמונות מוכיחות את אותה התנהגות על המכשיר הפיזי, עם החיישן האמיתי. אנחנו משתמשים בתמונות במקום בדמו חי בכוונה: הן אף פעם לא נכשלות על הבמה.
        ומה לא היינו צריכים? GSD או Superpowers. ה-sessions היו קצרים ואדם בדק כל שלב, אז כלל ההחלטה אומר לוותר על GSD. וה-constitution כבר דרשה בדיקות קודם (עיקרון II), אז גם השאלה על Superpowers אומרת לוותר.
        TIP: צלמו את התוצאות על החומרה האמיתית; ל-reviewer קל יותר להאמין לתמונה מאשר ל-log.

  # ---------------------------------------------------------------- Part V
  - id: main-vs-dev
    part: V
    budget: "1:30"
    layout: bullets-diagram
    title: { en: "main vs dev: published vs draft", he: "main מול dev: מהדורה מול טיוטה" }
    bullets:
      - { key: roles, en: "main = the published edition; dev = the draft desk", he: "main = המהדורה המודפסת; dev = שולחן הטיוטות" }
      - { key: rule, en: "Team rule: merge to main only after tests pass", he: "כלל צוות: merge ל-main רק אחרי שהבדיקות עוברות" }
    diagram:
      name: branch-flow
      highlight: [dev, main]
      labels: &branch_labels
        issue: { en: "issue #2", he: "issue #2" }
        feature: { en: "feature branch (DHT22)", he: "feature branch (DHT22)" }
        pr3: { en: "PR #3", he: "PR #3" }
        dev: { en: "dev", he: "dev" }
        prs: { en: "PR #4", he: "PR #4" }
        main: { en: "main", he: "main" }
    tip: { key: keep-main-working, en: "Keep main always working: merge into it only after the tests pass.", he: "שמרו על main תמיד עובד: עשו merge אליו רק אחרי שהבדיקות עוברות." }
    notes:
      en: |
        Analogy: a newspaper. The printed edition is what readers see, and it must always be right. The draft desk is where the messy work happens.
        Some vocabulary first. Git is the tool that tracks every version of your files. GitHub is the website where a team shares a Git repository, or repo: the project folder with its full history. A branch is a parallel copy of the project where you can work without disturbing anyone else.
        Two branches matter here. main is the published edition: always working, always safe to hand to someone. dev is the draft desk: work lands there first, gets combined, and gets checked.
        The team rule: merge into main only after the tests pass and the work is verified. To merge means bringing the changes from one branch into another.
        The diagram is this repo's real history, as an illustration: issue #2 is a to-do card asking for DHT22 support, and PR #3 is the change that delivered it; more on both next slide. To be clear, this was a one-person project, early work went straight to main, there is no automated test server, and main is not locked. A real team would add those.
        Tip: keep main always working, and merge into it only after the tests pass.
      he: |
        Analogy: עיתון. המהדורה המודפסת היא מה שהקוראים רואים, והיא חייבת להיות נכונה תמיד. שולחן הטיוטות הוא המקום שבו העבודה המבולגנת קורית.
        קודם קצת אוצר מילים. Git הוא הכלי שעוקב אחרי כל גרסה של הקבצים שלכם. GitHub הוא האתר שבו צוות משתף Git repository, או repo: תיקיית הפרויקט עם כל ההיסטוריה שלה. branch הוא עותק מקביל של הפרויקט, שבו אפשר לעבוד בלי להפריע לאף אחד.
        שני branches חשובים כאן. main הוא המהדורה המודפסת: תמיד עובד, תמיד בטוח למסור למישהו. dev הוא שולחן הטיוטות: העבודה נוחתת שם קודם, מתחברת ונבדקת.
        כלל הצוות: merge ל-main רק אחרי שהבדיקות עוברות והעבודה אומתה. merge פירושו להכניס את השינויים מ-branch אחד ל-branch אחר.
        התרשים הוא ההיסטוריה האמיתית של ה-repo הזה, כהמחשה: issue #2 הוא כרטיס משימה שביקש תמיכה ב-DHT22, ו-PR #3 הוא השינוי שסיפק אותה; עוד עליהם בשקף הבא. ולהבהיר: זה היה פרויקט של אדם אחד, עבודה מוקדמת הלכה ישר ל-main, אין שרת בדיקות אוטומטי, ו-main לא נעול. צוות אמיתי היה מוסיף את כל אלה.
        TIP: שמרו על main תמיד עובד, ועשו merge אליו רק אחרי שהבדיקות עוברות.

  - id: issues-prs
    part: V
    budget: "1:30"
    layout: bullets-diagram
    title: { en: "Issues and pull requests", he: "issues ו-pull requests" }
    bullets:
      - { key: issue, en: "Issue = a to-do card: what is wrong or wanted, and why", he: "issue = כרטיס משימה: מה שבור או חסר, ולמה" }
      - { key: link, en: "PR (pull request) = a change request someone reviews", he: "PR (pull request) = בקשת שינוי שמישהו עושה לה review" }
    diagram:
      name: branch-flow
      highlight: [issue, pr3, prs]
      labels: *branch_labels
    tip: { key: fixes-keyword, en: "Write 'Fixes #2' in the PR into main; GitHub then closes the issue on merge.", he: "כתבו 'Fixes #2' ב-PR שנכנס ל-main, וה-issue ייסגר אוטומטית ב-merge." }
    notes:
      en: |
        Analogy: a work order and a signed delivery note. The work order says what is needed and why; the delivery note shows exactly what was done, and someone signs it before it is accepted.
        An issue is the work order: a card on GitHub describing a bug or an enhancement, and why it matters. A pull request, or PR, is the delivery note: a set of changes you propose, which someone reviews before it is merged. Changes land through PRs, never by pushing straight into main.
        Follow the real chain on the diagram. Issue number 2 asked for DHT22 support, because the original sensor was not available. The work happened on a feature branch called 001-heltec-monitor-dht22-sensor. PR number 3 merged it into dev. Then PR number 4 carried it from dev into main. PRs 1 and 5 through 7 are other dev-to-main merges.
        Here is a small surprise: issue 2 is still open. GitHub only closes an issue automatically when a PR or commit that says "Fixes #2" lands on the default branch, here main. Nobody wrote "Fixes #2". And even if PR 3 had said it, GitHub would have ignored it, because PR 3 targeted dev, not the default branch.
        Tip: write "Fixes #2" in the PR that goes into main, and GitHub then closes the issue on merge.
      he: |
        Analogy: הזמנת עבודה ותעודת משלוח חתומה. הזמנת העבודה אומרת מה צריך ולמה; תעודת המשלוח מראה בדיוק מה נעשה, ומישהו חותם עליה לפני שהיא מתקבלת.
        issue הוא הזמנת העבודה: כרטיס ב-GitHub שמתאר באג או שיפור, ולמה זה חשוב. pull request, או PR, הוא תעודת המשלוח: סט שינויים שאתם מציעים, ומישהו עושה לו review לפני ה-merge. שינויים נכנסים דרך PRs, אף פעם לא ב-push ישיר ל-main.
        עקבו אחרי השרשרת האמיתית בתרשים. issue מספר 2 ביקש תמיכה ב-DHT22, כי החיישן המקורי לא היה זמין. העבודה נעשתה ב-feature branch בשם 001-heltec-monitor-dht22-sensor. PR מספר 3 הכניס אותו ל-dev. ואז PR מספר 4 העביר אותו מ-dev ל-main. PRs 1 ו-5 עד 7 הם merges אחרים מ-dev ל-main.
        והנה הפתעה קטנה: issue 2 עדיין פתוח. GitHub סוגר issue אוטומטית רק כש-PR או commit שכתוב בו “Fixes #2” נכנס ל-default branch, כאן main. אף אחד לא כתב “Fixes #2”. וגם אם PR 3 היה כותב את זה, GitHub היה מתעלם, כי PR 3 כוון ל-dev, לא ל-default branch.
        TIP: כתבו “Fixes #2” ב-PR שנכנס ל-main, ו-GitHub יסגור את ה-issue ב-merge.

  - id: shared-repo
    part: V
    budget: "2:00"
    layout: bullets-diagram
    title: { en: "Shared repo, shared specs/", he: "repo משותף, specs/ משותף" }
    bullets:
      - { key: specs, en: "specs/ = the team notebook: what each of us builds, and why", he: "specs/ = מחברת הצוות: מה כל אחד בונה, ולמה" }
      - { key: travel, en: "Specs ride in the same PR as the code they describe", he: "ה-specs נכנסים באותו PR יחד עם הקוד שהם מתארים" }
    diagram:
      name: branch-flow
      highlight: [feature, dev]
      labels: *branch_labels
    tip: { key: specs-in-pr, en: "Review the spec changes first in every pull request, then the code.", he: "עברו קודם על שינויי ה-spec בכל pull request, ורק אחר כך על הקוד." }
    notes:
      en: |
        Analogy: a shared lab notebook. Every scientist writes down what they are trying and why, so nobody repeats an experiment or undoes someone else's.
        A repo shared by more than one developer has one big risk: people do not know what the others are doing. Two people fix the same bug, or one quietly undoes another's decision.
        The specs folder is the answer. Every feature gets its own folder, like specs/001-heltec-monitor in this repo. Inside are the spec, the clarifications with their answers, the plan, the task list and the analysis report. Before you start work, you read the folder. Before you change a decision, you see why it was made.
        And the specs travel in the same pull request as the code they describe. The reviewer sees the change in intent and the change in code together, and can ask: does this code do what the spec now says?
        Imagine a second developer joining tomorrow. They would open specs/002 for their own feature, on their own branch, and everyone could read it in the PR before a line of code merged.
        Each Spec Kit stage of this repo is also tagged in Git and on GitHub, from 01-start to 09-hardware-verified, so you can replay how the spec grew.
        Tip: in every pull request, review the spec changes first, then the code.
      he: |
        Analogy: מחברת מעבדה משותפת. כל מדען כותב מה הוא מנסה ולמה, כדי שאף אחד לא יחזור על ניסוי או יבטל את העבודה של מישהו אחר.
        ל-repo שכמה מפתחים חולקים יש סיכון אחד גדול: אנשים לא יודעים מה האחרים עושים. שניים מתקנים את אותו באג, או שאחד מבטל בשקט החלטה של מישהו אחר.
        תיקיית ה-specs היא התשובה. לכל feature יש תיקייה משלו, כמו specs/001-heltec-monitor ב-repo הזה. בפנים יש את ה-spec, את ה-clarifications עם התשובות, את ה-plan, את רשימת המשימות ואת דוח הניתוח. לפני שמתחילים לעבוד, קוראים את התיקייה. לפני שמשנים החלטה, רואים למה היא התקבלה.
        וה-specs נכנסים באותו pull request יחד עם הקוד שהם מתארים. מי שעושה review רואה יחד את השינוי בכוונה ואת השינוי בקוד, ויכול לשאול: האם הקוד הזה עושה את מה שה-spec אומר עכשיו?
        דמיינו מפתחת שנייה שמצטרפת מחר. היא תפתח specs/002 ל-feature שלה, ב-branch משלה, וכולם יוכלו לקרוא אותו ב-PR לפני ששורת קוד אחת נכנסת.
        כל שלב של Spec Kit ב-repo הזה מסומן גם ב-tag ב-Git וב-GitHub, מ-01-start ועד 09-hardware-verified, כך שאפשר לשחזר איך ה-spec גדל.
        TIP: בכל pull request, עברו קודם על שינויי ה-spec, ורק אחר כך על הקוד.

  # ---------------------------------------------------------------- Part VI
  - id: skills
    part: VI
    budget: "1:00"
    layout: bullets
    title: { en: "Skills: recipe cards for the AI", he: "skills: כרטיסי מתכון ל-AI" }
    bullets:
      - { key: what, en: "A recipe card for the AI: written steps it loads when needed", he: "כרטיס מתכון ל-AI: צעדים כתובים שהוא טוען כשצריך" }
      - { key: share, en: "That card is a skill: write it once, reuse it everywhere", he: "הכרטיס הזה הוא skill: כותבים פעם אחת, משתמשים בכל מקום" }
    tip: { key: first-skill, en: "Turn the instruction you repeat most often into your first skill.", he: "הפכו את ההוראה שאתם חוזרים עליה הכי הרבה ל-skill הראשון שלכם." }
    notes:
      en: |
        What's next, not day one: once the basics feel normal, these three ideas are where teams go.
        Analogy: a recipe card you can hand to any new cook. You write it once, and every cook makes the dish the same way.
        A skill is exactly that for an AI agent: a written procedure, saved as a file, that the agent loads only when it needs it. "How we write a spec." "How we review a pull request." "How we release."
        You have already met skills today. In this project, Spec Kit's stages are installed as skills for the assistant, and Superpowers is essentially a library of skills.
        Write a skill once and you can share it across projects and teammates, so everyone's agent follows the same steps.
        Tip: turn the instruction you repeat most often into your first skill.
      he: |
        מה הלאה, לא היום הראשון: כשהבסיס כבר מרגיש טבעי, אלה שלושת הרעיונות שצוותים מגיעים אליהם.
        Analogy: כרטיס מתכון שאפשר לתת לכל טבח חדש. כותבים אותו פעם אחת, וכל טבח מכין את המנה באותה צורה.
        skill הוא בדיוק זה בשביל AI agent: נוהל כתוב, שמור כקובץ, שה-agent טוען רק כשהוא צריך אותו. “איך כותבים spec.” “איך עושים review ל-pull request.” “איך משחררים גרסה.”
        כבר פגשתם skills היום. בפרויקט הזה, השלבים של Spec Kit מותקנים כ-skills לעוזר, ו-Superpowers הוא בעצם ספרייה של skills.
        כותבים skill פעם אחת, ואפשר לשתף אותו בין פרויקטים וחברי צוות, כך שה-agent של כל אחד עובר את אותם צעדים.
        TIP: הפכו את ההוראה שאתם חוזרים עליה הכי הרבה ל-skill הראשון שלכם.

