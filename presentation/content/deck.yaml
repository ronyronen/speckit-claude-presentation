  - id: takeaways
    part: close
    budget: "1:30"
    layout: bullets
    title: { en: "Takeaways", he: "מה לוקחים הביתה" }
    bullets:
      - { key: intent, en: "Write the intent down before the AI writes the code", he: "כתבו את הכוונה לפני שה-AI כותב את הקוד" }
      - { key: context, en: "Keep the AI’s desk tidy: context rots in long sessions", he: "שמרו על השולחן של ה-AI מסודר: ב-sessions ארוכים יש context rot" }
      - { key: layers, en: "Pick layers by pain: planning first, helpers when needed", he: "בחרו שכבות לפי הבעיה: קודם תכנון, כלי עזר כשצריך" }
      - { key: heltec, en: "Heltec run: Spec Kit plus human review was enough", he: "בפרויקט Heltec: Spec Kit עם review אנושי הספיק" }
      - { key: team, en: "Branches, PRs and a shared specs/ make it a team sport", he: "branches, PRs ו-specs/ משותף הופכים את זה לעבודת צוות" }
    tip: { key: tomorrow, en: "Write a one-page spec before your next AI coding session, starting tomorrow.", he: "כתבו spec של עמוד אחד לפני ה-session הבא שלכם עם AI, כבר מחר." }
    notes:
      en: |
        Analogy: measure twice, cut once.
        Five things to take home. One: write the intent down before the AI writes the code. The spec, not the chat, is the source of truth.
        Two: keep the AI's desk tidy. Context rots in long sessions, so keep sessions short and keep decisions in files.
        Three: pick your layers by pain. Start with planning; add context isolation or enforced discipline only when you actually feel those problems.
        Four, from the case study: on the Heltec project, Spec Kit plus a human reviewing each stage was enough. Specify and clarify pinned down the hysteresis band, analyze caught a contradiction before any code existed, and eleven tests plus two photos proved the behavior.
        Five: make it a team sport, with issues, branches, pull requests and a shared specs folder, so everyone can see what everyone else is building and why.
        And one thing to do tomorrow, the tip: before your next AI coding session, write a one-page spec. Who is it for, what should it do, and how will you know it works?
      he: |
        Analogy: מודדים פעמיים, חותכים פעם אחת.
        חמישה דברים לקחת הביתה. אחד: כתבו את הכוונה לפני שה-AI כותב את הקוד. ה-spec, לא הצ'אט, הוא מקור האמת.
        שתיים: שמרו על השולחן של ה-AI מסודר. ב-sessions ארוכים יש context rot, אז שמרו על sessions קצרים ועל החלטות בקבצים.
        שלוש: בחרו שכבות לפי הבעיה. התחילו בתכנון; הוסיפו בידוד context או משמעת נאכפת רק כשאתם באמת נתקלים בבעיות האלה.
        ארבע, מה-case study: בפרויקט Heltec, Spec Kit יחד עם אדם שבודק כל שלב הספיקו. specify ו-clarify קיבעו את פס ה-hysteresis, analyze תפס סתירה עוד לפני שהיה קוד, ואחת עשרה בדיקות ושתי תמונות הוכיחו את ההתנהגות.
        חמש: הפכו את זה לעבודת צוות, עם issues, branches, pull requests ותיקיית specs משותפת, כך שכולם רואים מה כל אחד בונה ולמה.
        ודבר אחד לעשות מחר, ה-TIP: לפני ה-session הבא שלכם עם AI, כתבו spec של עמוד אחד. בשביל מי זה, מה זה צריך לעשות, ואיך תדעו שזה עובד?

